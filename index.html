<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>#OidoCocina - El Recetario de La Aldea</title>
    <style>
        :root { --bg: #f5f2eb; --text: #2c2520; --primary: #4a6b5d; --accent: #b85a38; --panel-bg: #ffffff; --border: #dfd8cb; }
        body { font-family: 'Georgia', Cambria, serif; background: var(--bg); color: var(--text); margin: 0; padding: 30px 20px; line-height: 1.5; }
        .caja-cabecera { max-width: 850px; margin: 0 auto 35px auto; background: #fffdfa; border: 1px solid var(--border); border-radius: 8px; padding: 40px 20px; text-align: center; box-shadow: 0 4px 15px rgba(44,37,32,0.02); }
        .caja-cabecera h1 { font-size: 2.8em; margin: 0; color: var(--primary); font-weight: bold; letter-spacing: -1px; text-transform: uppercase; }
        .caja-cabecera .subtitulo { font-size: 1.8em; color: var(--accent); font-style: italic; margin: 5px 0 20px 0; }
        .caja-cabecera .corazon { font-size: 3em; color: #2680eb; margin: 15px 0; display: inline-block; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08)); }
        .caja-cabecera .lema { font-size: 1.15em; font-style: italic; color: #5c534c; max-width: 600px; margin: 15px auto 5px auto; line-height: 1.6; }
        .caja-cabecera .hashtag { font-family: system-ui, sans-serif; font-weight: bold; color: #2680eb; font-size: 0.95em; margin-top: 10px; display: block; }
        .seccion-motores { max-width: 1000px; margin: 0 auto 30px auto; background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 4px 12px rgba(44,37,32,0.03); }
        .barra-superior { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 20px; }
        .buscador-caja { flex-grow: 1; }
        .buscador-caja input { font-family: inherit; width: 100%; padding: 12px; box-sizing: border-box; border: 2px solid var(--primary); border-radius: 6px; background-color: #fffdfa; font-size: 1.05em; }
        .btn-lanzar-formulario { background: var(--accent); color: white; border: none; padding: 12px 24px; font-size: 1.05em; font-family: system-ui, sans-serif; font-weight: bold; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 10px rgba(184,90,56,0.2); white-space: nowrap; transition: all 0.2s; }
        .btn-lanzar-formulario:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(184,90,56,0.3); }
        .bloque-filtros { margin-bottom: 15px; }
        .bloque-filtros:last-child { margin-bottom: 0; }
        .titulo-filtro { font-family: system-ui, sans-serif; font-size: 0.85em; font-weight: bold; color: #7a7167; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .grid-botones { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-filto { font-family: system-ui, sans-serif; background: #eeeae1; color: var(--text); border: 1px solid var(--border); padding: 6px 14px; border-radius: 4px; font-size: 0.9em; cursor: pointer; font-weight: 500; transition: all 0.15s; }
        .btn-filto:hover { background: #e4ded2; border-color: #c9bfae; }
        .btn-filto.activo { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-reset { background: #7f8c8d; color: white; border: none; }
        .btn-reset:hover { background: #6c7a7b; }
        .selector-vecino { font-family: system-ui, sans-serif; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--border); background: #fffdfa; color: var(--text); }
        .panel-recetas { max-width: 1000px; margin: 0 auto; background: var(--panel-bg); padding: 25px; border-radius: 12px; box-shadow: 0 6px 20px rgba(44,37,32,0.04); border: 1px solid var(--border); }
        .recetas-lista { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .receta-card { background: var(--panel-bg); padding: 22px; border-radius: 8px; border-top: 4px solid var(--primary); box-shadow: 0 4px 14px rgba(0,0,0,0.02); border-left: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; }
        .receta-card h3 { margin: 0 0 4px 0; color: var(--text); font-size: 1.35em; }
        .autor { font-style: italic; color: #7a7167; font-size: 0.9em; margin: 0 0 15px 0; }
        .meta-datos { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; font-family: system-ui, sans-serif; }
        .badge { background: #eae6dd; color: #4e463d; padding: 4px 8px; border-radius: 4px; font-size: 0.75em; font-weight: 600; border: 1px solid var(--border); }
        .badge.categoria { background: #fdf2e9; border-color: #f5d3c3; color: var(--accent); }
        .tags { margin: 12px 0; font-family: system-ui, sans-serif; }
        .tag { background: #eeeae1; color: #5c544c; padding: 3px 10px; border-radius: 12px; font-size: 0.78em; margin-right: 6px; display: inline-block; border: 1px solid rgba(0,0,0,0.02); }
        .tag.clicable { cursor: pointer; color: var(--primary); font-weight: 500; }
        .tag.clicable:hover { background: var(--primary); color: white; }
        .paginacion { text-align: center; margin-top: 30px; font-family: system-ui, sans-serif; }
        .paginacion button { width: auto; background: var(--primary); margin: 0 4px; padding: 8px 16px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-ver { background: var(--primary); font-size: 0.88em; padding: 8px 14px; margin-top: 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: system-ui, sans-serif; }
        .modal-formulario { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(44, 37, 32, 0.5); backdrop-filter: blur(4px); }
        .modal-contenido { background-color: var(--panel-bg); margin: 4% auto; padding: 30px; border: 1px solid var(--border); border-top: 6px solid var(--accent); width: 90%; max-width: 550px; border-radius: 12px; box-shadow: 0 12px 35px rgba(0,0,0,0.15); max-height: 82vh; overflow-y: auto; }
        .cerrar-modal { color: #bbb; float: right; font-size: 28px; font-weight: bold; cursor: pointer; font-family: system-ui, sans-serif; line-height: 20px; }
        .cerrar-modal:hover { color: var(--text); }
        .form-group { margin-bottom: 18px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.9em; font-family: system-ui, sans-serif; color: #5a5249; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; max-height: 140px; overflow-y: auto; padding: 12px; border: 2px solid var(--border); border-radius: 6px; background: #fffdfa; }
        .checkbox-item { display: flex; align-items: center; font-size: 0.85em; font-family: system-ui, sans-serif; }
        .checkbox-item input { width: auto; margin-right: 6px; }
        .btn-publicar { font-family: system-ui, sans-serif; background: var(--accent); color: white; border: none; padding: 14px 20px; font-size: 1.1em; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .vista-detalle { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); display: none; border: 1px solid var(--border); border-top: 6px solid var(--primary); }
        .vista-detalle h2 { font-size: 2.3em; margin-bottom: 5px; border: none; color: var(--text); }
        .pasos-caja { background: #fffdfa; padding: 25px; border-radius: 8px; border: 2px dashed var(--border); margin-top: 20px; line-height: 1.7; font-size: 1.1em; }
        .btn-volver { background: #7f8c8d; width: auto; display: inline-block; margin-bottom: 25px; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: system-ui, sans-serif; font-weight: bold; }
    </style>
</head>
<body>
    <div class="caja-cabecera" onclick="irAlInicio()" style="cursor: pointer;">
        <h1>El Recetario</h1>
        <div class="subtitulo">de La Aldea</div>
        <div class="corazon">💙</div>
        <p class="lema">"Recetas inclusivas y compartidas de nuestra comunidad para cocinar juntos en cualquier estación del año"</p>
        <span class="hashtag">#OidoCocina</span>
    </div>
    <div id="modulo-principal">
        <div class="seccion-motores">
            <div class="barra-superior">
             <div class="buscador-caja" style="display: flex; gap: 8px; width: 100%;">
            <input type="text" id="motor-busqueda" placeholder="🔍 Escribe para buscar por plato, ingrediente o autor..." style="flex: 1;">
            <button onclick="filtrarRecetas()" style="background-color: var(--primary); color: white; border: none; padding: 0 15px; border-radius: 4px; font-weight: bold; cursor: pointer;">
                Buscar
            </button>
        </div>

            </button>
        </div>
               <button class="btn-lanzar-formulario" onclick="abrirFormulario()">➕ Añadir Nueva Receta</button>
            </div>

            <div class="bloque-filtros">
                <div class="titulo-filtro">📁 Tipo de Plato:</div>
                <div class="grid-botones">
                    <button class="btn-filto" onclick="filtrarPorBoton('categoria', 'Entrante')">🥗 Entrantes</button>
                    <button class="btn-filto" onclick="filtrarPorBoton('categoria', 'Plato Principal')">🍲 Principales</button>
                    <button class="btn-filto" onclick="filtrarPorBoton('categoria', 'Postre')">🍰 Postres</button>
                    <button class="btn-filto" onclick="filtrarPorBoton('categoria', 'Salsa / Acompañamiento')">🍯 Salsas / Otros</button>
                    <button class="btn-filto" onclick="filtrarPorBoton('categoria', 'Especial Navidad')" style="border-color: #27ae60;">🎄 Especial Navidad</button>
                </div>
            </div>

            <div class="bloque-filtros">
                <div class="titulo-filtro">⚙️ Filtros Inteligentes y Maña:</div>
                <div class="grid-botones">
                    <button class="btn-filto" onclick="filtrarPorBoton('tiempo', 'exprés')">⚡ Exprés (≤ 30 min)</button>
                    <button class="btn-filto" onclick="filtrarPorBoton('tiempo', 'lento')">⏱️ Fuego Lento (≥ 60 min)</button>
                    <button class="btn-filto" onclick="filtrarPorBoton('dificultad', 'Fácil')">🟢 Fácil</button>
                    <button class="btn-filto" onclick="filtrarPorBoton('dificultad', 'Media')">🟡 Media</button>
                    <button class="btn-filto" onclick="filtrarPorBoton('dificultad', 'Avanzada')">🔴 Avanzada</button>
                </div>
            </div>

            <div class="bloque-filtros">
                <div class="titulo-filtro">👤 Filtrar por Vecino:</div>
                <select id="selector-autor" class="selector-vecino" onchange="filtrarPorVecino(this.value)">
                    <option value="">📋 Ver todas las autorías...</option>
                </select>
                <button class="btn-filto btn-reset" onclick="limpiarTodosLosFiltros()" style="margin-left: 10px;">🔄 Mostrar Todo / Limpiar</button>
            </div>
        </div>

        <div class="panel-recetas">
            <h2>Platos del Recetario Universal</h2>
            <div class="recetas-lista" id="recetas-display"></div>
            <div class="paginacion" id="paginacion-controles"></div>
        </div>
    </div>

    <div class="modal-formulario" id="modal-subida">
        <div class="modal-content modal-contenido">
            <span class="cerrar-modal" onclick="cerrarFormulario()">&times;</span>
            <h2 style="color: var(--accent); margin-bottom: 20px;">Subir Nueva Receta Universal</h2>
            <form id="form-receta">
                <div class="form-group">
                    <label for="titulo">Nombre del Plato:</label>
                    <input type="text" id="titulo" required placeholder="Ej. Sopa de Ajo Tradicional">
                </div>
                <div class="form-row">
                    <div>
                        <label for="autor">Tu Nombre o Pseudónimo:</label>
                        <input type="text" id="autor" required placeholder="Ej. Vecino de la Plaza">
                    </div>
                    <div>
                        <label for="categoria">Categoría Estacional:</label>
                        <select id="categoria" required>
                            <option value="Plato Principal">Plato Principal</option>
                            <option value="Entrante">Entrante / Plato Fresco</option>
                            <option value="Postre">Postre / Dulce</option>
                            <option value="Salsa / Acompañamiento">Salsa o Acompañamiento</option>
                            <option value="Especial Navidad">🎄 Especial Navidad</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label for="tiempo">Tiempo total (minutos):</label>
                        <input type="number" id="tiempo" required min="1" placeholder="Ej. 25">
                    </div>
                    <div>
                        <label for="raciones">Comensales / Raciones:</label>
                        <input type="number" id="raciones" required min="1" placeholder="Ej. 4">
                    </div>
                </div>
                <div class="form-group">
                    <label for="dificultad">Dificultad de la Elaboración:</label>
                    <select id="dificultad" required>
                        <option value="Fácil">🟢 Fácil</option>
                        <option value="Media">🟡 Media</option>
                        <option value="Avanzada">🔴 Avanzada</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Selecciona los Ingredientes de la Nevera (A-Z):</label>
                    <div class="checkbox-grid" id="contenedor-ingredientes"></div>
                </div>
                <div class="form-group">
                    <label for="pasos">Preparación del Plato (Paso a Paso):</label>
                    <textarea id="pasos" rows="4" required placeholder="Explica detalladamente cómo cocinarlo..."></textarea>
                </div>
                <button type="submit" class="btn-publicar">Publicar de forma Autónoma</button>
            </form>
        </div>
    </div>

    <div class="vista-detalle" id="modulo-detalle">
        <button class="btn-volver" onclick="irAlInicio()">← Volver al Catálogo</button>
        <div id="detalle-contenido"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
